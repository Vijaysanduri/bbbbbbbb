name: Database backup to Google Drive

# Runs every day at 02:00 UTC, and can also be triggered manually from
# the Actions tab in GitHub (Run workflow button) for an on-demand backup.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install postgresql-client (for pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backup script dependencies
        working-directory: scripts/backup
        run: npm install

      - name: Run backup
        working-directory: scripts/backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_BACKUP_FOLDER_ID: ${{ secrets.DRIVE_BACKUP_FOLDER_ID }}
        run: node backup-to-drive.js
